name: Update holidays

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade holidays
      - run: python tool/generate_holidays.py
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
      - name: Commit if changed
        run: |
          if git diff --quiet assets/holidays.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/holidays.json
          git commit -m "공휴일 데이터 자동 갱신"
          git push
